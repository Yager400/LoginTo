messages-version: "1"

# While modifying these messages, you can use the following features:

# Titles and Subtitles
# You can use the <title> tag to send the player a title instead of a message.
# If you want to add a subtitle, use the <subtitle> tag after <title>.
# Everything after the <subtitle> tag will be displayed as the subtitle.
# WARN: Make sure that the <title> tag is the first thing in the message,
  # otherwise the player will see the <title> tag as part of the message.
# Also keep in mind that, due to compatibility issues, titles
  # only support legacy minimessage (so no gradient or hex colors).

# Placeholders
# In some messages, you can use placeholders such as %placeholder%.
# LoginTo will replace them with their corresponding values.

# External Support
# LoginTo also supports MiniMessage for additional customization
 # and PlaceholderAPI (if installed).

register:
  # This player is already registered
  already-registered: "<red>You are already registered!"
  # This player's password does not contain the required characters (Placeholder: %characters%)
  no-required-character-error: "<red>Your password must contain these characters: %characters%."
  # The password is too short or too long (Placeholder: %min_length%, %max_length%)
  password-length-error: "<red>Your password must be between %min_length% and %max_length% characters long."
  # The second password does not match the first one
  password-confirmation-mismatch: "<red>The passwords do not match!"
  # This password is too simple
  password-is-too-simple: "<red>This password is too simple, chose another one."

  # Prompt shown when the player joins the server for the first time
  register-prompt: "<dark_aqua>Welcome! Use /register <password> <confirm_password> to register."
  # Prompt shown when the player joins the server for the first time and the password must contain
  # specific required characters (Placeholder: %characters%)
  register-prompt-require-characters: "<dark_aqua>Welcome! Use /register <password> <confirm_password> to register. Make sure to include one of these characters: %characters%."
  # The registration was completed successfully
  registration-success: "<green>Registration completed successfully! Have fun on the server."

login:
  # This player is not registered
  not-registered: "<red>You are not registered yet!"
  # This player is already logged in
  already-logged-in: "<red>You are already logged in."
  # The password is incorrect
  wrong-password: "<red>Incorrect password."

  # Prompt shown when the player joins the server
  login-prompt: "<dark_aqua>Please use /login <password> to authenticate."
  # The login was completed successfully
  login-success: "<green>Logged in successful! Welcome back."

unregister:
  # This player does not exist
  invalid-player: "<red>That player does not exist."
  # Sent to the admin when they try to unregister themselves
  cannot-unregister-yourself: "<red>You cannot unregister yourself!"

  # Unregistration was completed successfully
  # User's point of view
  unregister-success: "<red>Your account was deleted by an administrator. Please rejoin to create a new one."
  # Admin's point of view
  admin-unregister-success: "<green>Account unregistered successfully."

changepassword:
  # The entered OTP code is incorrect
  wrong-otp-code: "<red>The OTP code is incorrect."
  # This player is not registered
  not-registered: "<red>You are not registered yet!"
  # The new password does not contain the required characters (Placeholder: %characters%)
  no-required-character-error: "<red>Your password must contain these characters: %characters%."
  # The new password is too short or too long (Placeholder: %min_length%, %max_length%)
  password-length-error: "<red>Your password must be between %min_length% and %max_length% characters long."
  # This password is too simple
  password-is-too-simple: "<red>This password is too simple, chose another one."
  # The player didn't generate any otp token
  no-otp-code-found: "<red>Your account does not have an otp code saved, generate one by doing <green>/otp"

  # The password was changed successfully
  password-changed: "<green>Your password has been changed. Please rejoin and log in again."

otp:
  # An OTP code has already been created for this user
  otp-already-created: "<red>You can only create one OTP token per account, ask an admin for the account unregistration."

  # Warning shown to the player before giving them the map
  # containing the QR code
  otp-alert: "<bold><gold>WARNING:</gold></bold><red>This feature allows you to change your password during the login. \nYou will receive a map containing a QRCode to scan with your authenticator app (e.g. Google Authenticator). \nMake sure that you are not screen sharing. \nIf it is safe to proceed, type <green>/otp</green> again to generate your code. \nAfter 20 seconds the map will be automatically removed from the server."

# All messages related to the premium feature.
# If this feature is disabled, ignore these settings.
premium:
  # Cracked command messages. This allows a cracked user to
  # lock their username, so if a premium account with that name
  # is purchased in the future, this cracked player will still
  # have access to the server.
  cracked:
    already-cracked: "<red>You are already cracked!"
    cracked-warn: "<gold>By executing this command, this username will be locked and always considered a cracked username by this server. \nEven if a premium account with this name joins the server, they won't be able to skip the login. \nYou can change this by doing <green>/premium<gold>. \nRetype <green>/cracked<gold> for continuing."
    cracked-success: "<green>You are now a cracked user!"
  # Lock this username as premium, even if no premium account with
  # that name exists. This should only be run by players who have
  # previously executed the cracked command and purchased a premium account.
  premium:
    already-premium: "<red>You are already premium!"
    premium-warn: "<gold>By executing this command as a cracked user, this username will be locked under the premium authentication, meaning that someone with a cracked client won't be able to join the server with this username. \nThis action is irreversible so make sure that this is voluntary and not an accident. \nRetype <green>/premium<gold> for continuing."
    premium-success: "<green>You are now a premium user!"
  # Auto-registration message (Placeholder: %autogenerated_password%)
  registration:
    auto-register-premium: "<green>Auto registration completed with the premium account!. This is your auto generated password:<gold> %autogenerated_password%."
    auto-register-bedrock: "<green>Auto registration completed with the bedrock account!. This is your auto generated password:<gold> %autogenerated_password%."
  # Auto-login message
  login:
    auto-login-premium: "<green>Auto logged in with the premium account! Welcome back."
    auto-login-bedrock: "<green>Auto logged in with the bedrock account! Welcome back."
  # The player tries to skip authentication, causing them to
  # have an unauthenticated profile
  skipped-authentication: "<red>You do not have an authenticated profile right now. Please contact the staff or try restarting your launcher."
  # This Java player was marked as a Bedrock player by Floodgate
  java-player-marked-as-bedrock: "<red>You got marked as bedrock player, but it seems you are from java, try rejoining."
  # This player has a different UUID on the server and during
  # authentication. This is usually an error or a security check.
  logged-in-with-different-uuid: "<red>The authentication system and the server have 2 different UUID related to your account, try rejoining."

sessions:
  # This player logged from the same ip in a short amount of time.
  logged-in-with-session: "<green>Auto logged from the old session! Welcome back."

# Messages sent during the login phase
during-login:
  # The player executed a command before logging in
  execute-command-pre-login: "<red>Please authenticate yourself before using commands."
  # The player did not complete the login in time
  kicked-for-long-waiting: "<red>Authentication timed out. Please rejoin and try again."
  # The player entered the wrong password too many times
  kicked-for-failing-the-login: "<red>Too many failed login attempts. Please rejoin and try again."
  # The player is trying to join, but another account with the same
  # name is already online on the server
  another-player-with-same-name: "<red>Another player with your name is already online on this server."
  # The player tries to chat before logging in
  chatting-before-login: "<red>You must log in before you can use the chat."
name: LoginTo
version: ${version}
main: com.github.yager400.loginto.bukkit.LoginTo
api-version: 1.18
api: spigot
folia-supported: true
authors: [ Yager400 ]
load: STARTUP
softdepend: [ PlaceholderAPI, packetevents, floodgate ]
commands:
  register:
    usage: /register <password> <confirm_password>
    aliases: [ "r" ]
    permission: loginto.register
  login:
    usage: /login <password>
    aliases: [ "l" ]
    permission: loginto.login
  unregister:
    usage: /unregister <user> <confirm>
    aliases: [ "delacc" ]
    permission: loginto.unregister
  changepassword:
    usage: /changepassword <new_password> <otp_code>
    permission: loginto.changepassword
  premium:
    usage: /premium [optional]<user>
    permission: loginto.premium.me
  cracked:
    usage: /cracked [optional]<user>
    permission: loginto.cracked.me
  loginto:
    usage: /loginto help
    permission: loginto.loginto
  otp:
    usage: /otp
    permission: loginto.otp
permissions:
  loginto.register:
    default: true
  loginto.login:
    default: true
  loginto.unregister:
    default: op
  loginto.changepassword:
    default: true
  loginto.premium.me:
    default: true
  loginto.premium.other:
    default: op
  loginto.cracked.me:
    default: true
  loginto.cracked.other:
    default: op
  loginto.loginto:
    default: op
  loginto.otp:
    default: true
